name: v2-cleanup-simulations

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Retention days for simulation runs"
        required: false
        default: "30"
      apply_delete:
        description: "Set true to delete (false = dry-run)"
        required: false
        default: "false"
  schedule:
    - cron: "30 2 * * *"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.V2_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: v2_core
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Dry-run cleanup summary
        if: ${{ github.event_name == 'schedule' || github.event.inputs.apply_delete != 'true' }}
        working-directory: v2_core
        run: |
          python scripts/cleanup_stale_simulations.py --retention-days ${{ github.event.inputs.retention_days || '30' }} --respect-workspace-policy

      - name: Apply cleanup
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply_delete == 'true' }}
        working-directory: v2_core
        run: |
          python scripts/cleanup_stale_simulations.py --retention-days ${{ github.event.inputs.retention_days || '30' }} --respect-workspace-policy --apply
