name: v2-tests

on:
  push:
    paths:
      - "v2_core/**"
      - ".github/workflows/v2-tests.yml"
  pull_request:
    paths:
      - "v2_core/**"
      - ".github/workflows/v2-tests.yml"
  schedule:
    - cron: "0 2 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_JWT_SECRET: ci_dummy_secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: v2_core
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Apply migrations
        working-directory: v2_core
        run: python scripts/apply_migrations.py

      - name: Run unit tests
        working-directory: v2_core
        run: pytest -q tests -k "not integration"

      - name: Run DB integration tests
        working-directory: v2_core
        env:
          RUN_DB_INTEGRATION: "1"
        run: |
          pytest -q tests/test_rls_integration.py
          pytest -q tests/test_e2e_flow_integration.py
