name: v2-web-smoke

on:
  push:
    paths:
      - "v2_core/apps/web/**"
      - ".github/workflows/v2-web-smoke.yml"
  pull_request:
    paths:
      - "v2_core/apps/web/**"
      - ".github/workflows/v2-web-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: v2_core/apps/web
        run: npm install

      - name: Install Playwright browser
        working-directory: v2_core/apps/web
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: v2_core/apps/web
        run: npm run smoke:test
